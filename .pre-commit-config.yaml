# Pre-commit hooks for quality checks
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

---
repos:
  # REUSE compliance
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.1.2
    hooks:
      - id: reuse

  # Code formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json, javascript, ts]
        exclude: >-
          package-lock\.json|composer\.lock|yarn\.lock|pnpm-lock\.yaml|boost\.json|\.github/copilot-instructions\.md

  # Markdown linting
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: markdownlint
        args: ["--config", ".markdownlint.json"]
        language: node
        additional_dependencies:
          - markdownlint-cli@0.49.0
        types: [markdown]
        exclude: '\.github/copilot-instructions\.md'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yml"]

  # GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Laravel Pint (PHP code style)
  # CRITICAL: Uses --dirty to auto-fix only changed files (fast)
  # Preflight script will verify with --test flag for CI parity
  - repo: local
    hooks:
      - id: pint
        name: Laravel Pint
        entry: >-
          bash -c 'if [ -x vendor/bin/pint ]; then vendor/bin/pint --dirty;
          fi'
        language: system
        types: [php]
        pass_filenames: false

  # Git hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
