# Codecov Configuration for API Project
# Overrides organization-level config for patch coverage

coverage:
  status:
    patch:
      default:
        target: 80%
        threshold: 1%
        # Allow patch check to be informational only
        # Type hint changes don't show as "executed" but are still tested
        informational: true
