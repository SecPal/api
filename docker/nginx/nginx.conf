worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe escape=json '{"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,"upstream_status":"$upstream_status","upstream_connect_seconds":"$upstream_connect_time","upstream_seconds":"$upstream_response_time"}';
    access_log /dev/stdout safe;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client-body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 12m;
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    server {
        # Raw request errors include query secrets; safe access records retain
        # HTTP/upstream status and timing. Lifecycle errors stay on stderr.
        error_log /dev/null;
        listen 8080;
        server_name _;
        root /app/public;
        disable_symlinks on from=/app/public;
        location ~ /\. { return 404; }
        location ~* \.license$ { return 404; }
        location = /__secpal_fpm_ping { return 404; }
        location = /index.php { include /etc/nginx/secpal-fastcgi.conf; }
        location ~* \.php(?:/|$) { return 404; }
        location / { try_files $uri @laravel; }
        location @laravel { include /etc/nginx/secpal-fastcgi.conf; }
    }
}
