[global]
error_log=/proc/self/fd/2
daemonize=no
process_control_timeout=10s
[secpal]
user=secpal
group=secpal
listen=/run/secpal-fpm/api.sock
listen.mode=0660
pm=ondemand
pm.max_children=4
pm.process_idle_timeout=10s
pm.max_requests=500
clear_env=yes
env[APP_NAME]=$APP_NAME
env[APP_ENV]=$APP_ENV
env[APP_DEBUG]=$APP_DEBUG
env[LOG_CHANNEL]=$LOG_CHANNEL
env[APP_URL]=$APP_URL
env[FRONTEND_URL]=$FRONTEND_URL
env[SANCTUM_STATEFUL_DOMAINS]=$SANCTUM_STATEFUL_DOMAINS
env[CORS_ALLOWED_ORIGINS]=$CORS_ALLOWED_ORIGINS
env[TRUSTED_PROXIES]=$TRUSTED_PROXIES
env[MAIL_MAILER]=$MAIL_MAILER
env[ADDRESS_DATA_IMPORT_ON_SETUP]=$ADDRESS_DATA_IMPORT_ON_SETUP
catch_workers_output=yes
decorate_workers_output=no
security.limit_extensions=.php
php_admin_flag[display_errors]=off
php_admin_flag[log_errors]=on
php_admin_value[error_log]=/proc/self/fd/2
php_admin_value[memory_limit]=128M
ping.path=/__secpal_fpm_ping
ping.response=pong
