---

# Dependabot configuration for SecPal API (Laravel 13)
# Automatically creates PRs for ALL dependency updates (including Major versions)
# Security updates are prioritized and checked daily in early morning hours
version: 2
updates:
  # Composer - PHP/Laravel dependencies
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "composer"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "/"

  # GitHub Actions - Workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "/"

  # npm - JavaScript dependencies (if frontend assets exist)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "/"
