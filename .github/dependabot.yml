---
# Dependabot configuration for SecPal API (Laravel 13)
# Automatically creates PRs for ALL dependency updates (including Major versions)
# Security updates are prioritized and checked daily in early morning hours
version: 2
updates:
  # Composer - PHP/Laravel dependencies
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "composer"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  # GitHub Actions - Workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    groups:
      shared-github-workflows:
        patterns:
          - "SecPal/.github/.github/workflows/*"
      shared-github-workflows-security:
        applies-to: "security-updates"
        patterns:
          - "SecPal/.github/.github/workflows/*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  # OCI base images use reviewed literal FROM pins.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/php-fpm"
      - "/docker/nginx"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    groups:
      composer-image:
        patterns:
          - "library/composer"
        group-by: "dependency-name"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "dependabot"
    open-pull-requests-limit: 10
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: "pip"
    directory: "/docker/python"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "dependabot"
    open-pull-requests-limit: 10
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "dependabot"
    open-pull-requests-limit: 10
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"
