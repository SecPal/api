---
name: Released API Artifact Security

on:
  schedule:
    # One shared call per run: central evidence names are run-scoped.
    - cron: "17 3 * * *" # FPM AMD64 daily, UTC
    - cron: "17 5 * * *" # FPM ARM64 daily, UTC
    - cron: "37 3 * * *" # Nginx AMD64 daily, UTC
    - cron: "37 5 * * *" # Nginx ARM64 daily, UTC
  workflow_dispatch:
    inputs:
      component:
        description: Exact component of the accepted runtime pair.
        required: true
        default: php-fpm
        type: choice
        options: [php-fpm, nginx]
      platform:
        description: Exact released platform to re-evaluate.
        required: true
        default: linux/amd64
        type: choice
        options: [linux/amd64, linux/arm64]
      index-digest:
        description: Optional component index digest; empty uses the reviewed pair.
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  subject:
    name: Select the reviewed released subject
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      # Authenticated publisher 42987289933: candidate attempt 1, acceptance 2.
      # One attested pair; each component retains its own index and native SBOMs.
      # Update this tuple only from another reviewed, accepted publication.
      MONITORED_RELEASE: |
        {
          "pair-artifact": "ghcr.io/secpal/api@sha256:b95c184cfc999d8be7a36c3d9f8a8b9bf402856a0d0923c095fe828e20a3d80a",
          "publisher-workflow-sha": "30a326d6c2e32a9e1251d75bfe603b3026babfc1",
          "components": {
            "php-fpm": {
              "index-digest": "sha256:e6bd9bb7608298e2d4ac807883cbb378d58134025a9b5e8dbec88af919112024",
              "platforms": {
                "linux/amd64": {
                  "platform-digest": "sha256:4eeda7c044430073b16cf52ae83a5b1c9a66b8d65902f5df2ea7c6386fec955f",
                  "syft-spdx-artifact":
                    "ghcr.io/secpal/api@sha256:160a54d0a4ff91a88047c8483bfb8b1540f4b720081cb98fc830126b2b9bb27d"
                },
                "linux/arm64": {
                  "platform-digest": "sha256:cc3fe6fd421a6692e2fe90026fe855c18cf7525f2fac3c6b1f545cc3e75ad455",
                  "syft-spdx-artifact":
                    "ghcr.io/secpal/api@sha256:83d3dd20f84b0202d1253d54676189ed886ae56f34c6f601b876cff2d95ae1c3"
                }
              }
            },
            "nginx": {
              "index-digest": "sha256:4bfeca7ead5436c5c4b9d51823d2438be91e5f88c25d07b8695a0a5c614a8b90",
              "platforms": {
                "linux/amd64": {
                  "platform-digest": "sha256:15a00fa123f26ccc02d29251ceac44be11bf83dde721d8a0a06507e00992c02f",
                  "syft-spdx-artifact":
                    "ghcr.io/secpal/api@sha256:f4202119568f2aaf2ba01fd5bacc466df5e13c568db45c39e095ff3c5b9a275e"
                },
                "linux/arm64": {
                  "platform-digest": "sha256:3f8c99815b132bbacd1665c0bc8e0645275b9913f173da3c2560eb1a23e840b6",
                  "syft-spdx-artifact":
                    "ghcr.io/secpal/api@sha256:7b3316ba39d855d98898aa86d71598efb6e71c50d63932782e203fc0aba9a3ef"
                }
              }
            }
          }
        }
    outputs:
      index-digest: ${{ steps.subject.outputs.index-digest }}
      platform: ${{ steps.subject.outputs.platform }}
      platform-digest: ${{ steps.subject.outputs.platform-digest }}
      syft-spdx-artifact: ${{ steps.subject.outputs.syft-spdx-artifact }}
      publisher-workflow-sha: ${{ steps.subject.outputs.publisher-workflow-sha }}
    steps:
      - name: Select reviewed release and platform
        id: subject
        shell: python3 -I {0}
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          PLATFORM: ${{ inputs.platform }}
          COMPONENT: ${{ inputs.component }}
          INDEX_DIGEST: ${{ inputs.index-digest }}
        run: |
          import json
          import os

          if (os.environ["GITHUB_REPOSITORY"] != "SecPal/api"
                  or os.environ["GITHUB_REF"] != "refs/heads/main"):
              raise SystemExit("Unsupported monitoring context.")

          release = json.loads(os.environ["MONITORED_RELEASE"])
          event, schedule = os.environ["EVENT"], os.environ["SCHEDULE"]
          platform, requested = os.environ["PLATFORM"], os.environ["INDEX_DIGEST"]
          component = os.environ["COMPONENT"]
          schedules = {
              "17 3 * * *": ("php-fpm", "linux/amd64"),
              "17 5 * * *": ("php-fpm", "linux/arm64"),
              "37 3 * * *": ("nginx", "linux/amd64"),
              "37 5 * * *": ("nginx", "linux/arm64"),
          }
          if (event == "schedule" and schedule in schedules
                  and not component and not platform and not requested):
              component, platform = schedules[schedule]
          elif event != "workflow_dispatch" or schedule:
              raise SystemExit("Unsupported monitoring event.")

          components = release["components"]
          if (set(components) != {"php-fpm", "nginx"}
                  or component not in components
                  or any(set(value["platforms"]) != {"linux/amd64", "linux/arm64"}
                         for value in components.values())):
              raise SystemExit("Unknown runtime pair or component.")
          selected = components[component]
          if (platform not in selected["platforms"]
                  or requested and requested != selected["index-digest"]):
              raise SystemExit("Unknown released artifact or platform.")

          subject = selected["platforms"][platform]
          values = {
              "index-digest": selected["index-digest"],
              "platform": platform,
              "platform-digest": subject["platform-digest"],
              "syft-spdx-artifact": subject["syft-spdx-artifact"],
              "publisher-workflow-sha": release["publisher-workflow-sha"],
          }
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"Accepted runtime pair: `{release['pair-artifact']}`\n\n")
                  summary.write(f"Component: `{component}`, platform: `{platform}`\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")

  reevaluate:
    name: Re-evaluate the exact released platform
    needs: subject
    # Only the callee's independently validated triage job receives issue writes.
    permissions:
      attestations: read
      contents: read
      issues: write
      packages: read
    uses: >-
      SecPal/.github/.github/workflows/reusable-vulnerability-reevaluation.yml@03bbb63cf7d02acaa2c679ffd8bb92246ecefaa6
    with:
      artifact-repository: ghcr.io/secpal/api
      index-digest: ${{ needs.subject.outputs.index-digest }}
      platform-digest: ${{ needs.subject.outputs.platform-digest }}
      platform: ${{ needs.subject.outputs.platform }}
      syft-spdx-artifact: ${{ needs.subject.outputs.syft-spdx-artifact }}
      publisher-repository: SecPal/api
      publisher-workflow: SecPal/api/.github/workflows/publish-container.yml
      publisher-workflow-sha: ${{ needs.subject.outputs.publisher-workflow-sha }}
      triage: true
