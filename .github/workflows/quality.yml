# SPDX-License-Identifier: CC0-1.0

name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@bc27f015e7e277a829b9620e4cf55ea9080c8b46

  license-compatibility:
    name: Check License Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install REUSE tooling
        run: pip install reuse

      - name: Generate REUSE SPDX document
        run: |
          echo "Checking for AGPL-3.0-or-later compatibility..."
          reuse spdx --add-license-concluded --creator-person "SecPal Contributors" -o reuse.spdx

      - name: Check license compatibility
        run: bash scripts/check-license-compatibility.sh reuse.spdx

  pre-commit-hooks:
    name: Pre-commit Hook Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install npm 12 and pre-commit
        run: |
          npm install --global npm@12.0.0
          python -m pip install pre-commit==4.5.1

      - name: Install and validate hooks
        run: |
          pre-commit validate-config
          pre-commit install-hooks

      - name: Run npm-backed hooks
        run: |
          pre-commit run prettier --files .pre-commit-config.yaml
          pre-commit run markdownlint --files CHANGELOG.md README.md

  prettier:
    name: Formatting Check
    uses: ./.github/workflows/reusable-prettier.yml

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@bc27f015e7e277a829b9620e4cf55ea9080c8b46
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  ai-instructions:
    name: AI Instructions
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@bc27f015e7e277a829b9620e4cf55ea9080c8b46
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  pint:
    name: Laravel Pint
    uses: SecPal/.github/.github/workflows/reusable-php-lint.yml@bc27f015e7e277a829b9620e4cf55ea9080c8b46
    with:
      php-version: "8.4"

  phpstan:
    name: PHPStan
    uses: SecPal/.github/.github/workflows/reusable-php-stan.yml@bc27f015e7e277a829b9620e4cf55ea9080c8b46
    with:
      php-version: "8.4"

  # NOTE: PEST tests are owned by .github/workflows/php-ci.yml (job: `test`,
  # context: `PEST Tests`). Do not re-add a PEST job here — duplicate
  # required-check context names confuse GitHub branch-protection gates.
  # See: https://github.com/SecPal/api/issues/1157
