# SPDX-FileCopyrightText: 2025-2026 SecPal
# SPDX-License-Identifier: CC0-1.0

name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@main

  license-compatibility:
    name: Check License Compatibility
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@main

  prettier:
    name: Formatting Check
    uses: ./.github/workflows/reusable-prettier.yml

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@main

  copilot-instructions:
    name: Copilot Instructions
    uses: SecPal/.github/.github/workflows/reusable-copilot-instructions.yml@main

  pint:
    name: Laravel Pint
    uses: SecPal/.github/.github/workflows/reusable-php-lint.yml@main
    with:
      php-version: "8.4"

  phpstan:
    name: PHPStan
    uses: SecPal/.github/.github/workflows/reusable-php-stan.yml@main
    with:
      php-version: "8.4"

  # NOTE: PEST tests are owned by .github/workflows/php-ci.yml (job: `test`,
  # context: `PEST Tests`). Do not re-add a PEST job here — duplicate
  # required-check context names confuse GitHub branch-protection gates.
  # See: https://github.com/SecPal/api/issues/1157
