# SPDX-License-Identifier: CC0-1.0

name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@3505a1da91e8b5cca4e34a024f1d35a7a792149e

  license-compatibility:
    name: Check License Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install REUSE tooling
        run: pip install reuse

      - name: Generate REUSE SPDX document
        run: |
          echo "Checking for AGPL-3.0-or-later compatibility..."
          reuse spdx --add-license-concluded --creator-person "SecPal Contributors" -o reuse.spdx

      - name: Check license compatibility
        run: bash scripts/check-license-compatibility.sh reuse.spdx

  prettier:
    name: Formatting Check
    uses: ./.github/workflows/reusable-prettier.yml

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@f9c5276c9fd9a6965a4ddd641c9fae10184e03df
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  ai-instructions:
    name: AI Instructions
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@3505a1da91e8b5cca4e34a024f1d35a7a792149e
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  pint:
    name: Laravel Pint
    uses: SecPal/.github/.github/workflows/reusable-php-lint.yml@f9c5276c9fd9a6965a4ddd641c9fae10184e03df
    with:
      php-version: "8.4"

  phpstan:
    name: PHPStan
    uses: SecPal/.github/.github/workflows/reusable-php-stan.yml@3505a1da91e8b5cca4e34a024f1d35a7a792149e
    with:
      php-version: "8.4"

  # NOTE: PEST tests are owned by .github/workflows/php-ci.yml (job: `test`,
  # context: `PEST Tests`). Do not re-add a PEST job here — duplicate
  # required-check context names confuse GitHub branch-protection gates.
  # See: https://github.com/SecPal/api/issues/1157
