name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434

  license-compatibility:
    name: Check License Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install REUSE tooling
        run: pip install reuse

      - name: Generate REUSE SPDX document
        run: |
          echo "Checking for AGPL-3.0-or-later compatibility..."
          reuse spdx -o reuse.spdx

      - name: Check license compatibility
        run: |
          licenses=$(grep "LicenseInfoInFile" reuse.spdx | cut -d':' -f2 | sort -u | tr -d ' ')

          echo "Found licenses: $licenses"

          compatible_licenses=(
            "AGPL-3.0-or-later"
            "GPL-3.0-or-later"
            "LGPL-3.0-or-later"
            "MIT"
            "BSD-2-Clause"
            "BSD-3-Clause"
            "Apache-2.0"
            "CC0-1.0"
            "ISC"
            "OFL-1.1"
            "ODbL-1.0"
            "LicenseRef-SecPal-Attribution"
          )

          incompatible_found=0
          for license in $licenses; do
            found=0
            for compatible in "${compatible_licenses[@]}"; do
              if [[ "$license" == "$compatible" ]]; then
                found=1
                break
              fi
            done
            if [ $found -eq 0 ]; then
              echo "ERROR: Incompatible license found: $license"
              incompatible_found=1
            fi
          done

          if [ $incompatible_found -eq 1 ]; then
            echo "ERROR: Found licenses incompatible with AGPL-3.0-or-later"
            exit 1
          fi

          echo "All licenses are compatible with AGPL-3.0-or-later"

  prettier:
    name: Formatting Check
    uses: ./.github/workflows/reusable-prettier.yml

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  ai-instructions:
    name: AI Instructions
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  pint:
    name: Laravel Pint
    uses: SecPal/.github/.github/workflows/reusable-php-lint.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434
    with:
      php-version: "8.4"

  phpstan:
    name: PHPStan
    uses: SecPal/.github/.github/workflows/reusable-php-stan.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434
    with:
      php-version: "8.4"

  # NOTE: PEST tests are owned by .github/workflows/php-ci.yml (job: `test`,
  # context: `PEST Tests`). Do not re-add a PEST job here — duplicate
  # required-check context names confuse GitHub branch-protection gates.
  # See: https://github.com/SecPal/api/issues/1157
