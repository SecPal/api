name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@main

  license-compatibility:
    name: Check License Compatibility
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@main

  prettier:
    name: Formatting Check
    uses: ./.github/workflows/reusable-prettier.yml

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@main

  pint:
    name: Laravel Pint
    uses: SecPal/.github/.github/workflows/reusable-php-lint.yml@main
    with:
      php-version: "8.4"

  phpstan:
    name: PHPStan
    uses: SecPal/.github/.github/workflows/reusable-php-stan.yml@main
    with:
      php-version: "8.4"

  pest:
    name: PEST Tests
    runs-on: ubuntu-latest
    # Skip tests for spike branches (exploration/prototyping)
    # Spike branches are for experimentation and cannot be merged to main
    # See: CONTRIBUTING.md - Spike Branch Policy
    if: ${{ !startsWith(github.head_ref, 'spike/') && !startsWith(github.ref, 'refs/heads/spike/') }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        options: >-
          --health-cmd="pg_isready -U testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install OpenTimestamps CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install --break-system-packages opentimestamps-client
          ots --version

      - name: Create parallel test databases
        env:
          PGPASSWORD: testing
        run: |
          # Create databases for parallel test workers (Laravel's ParallelTesting uses test_1, test_2, etc.)
          for i in {1..8}; do
            psql -h localhost -U testing -d testing -c "CREATE DATABASE testing_test_$i;" || true
          done

      - name: Run Tests
        env:
          # Test-only APP_KEY - not used in production
          APP_KEY: base64:ZXUevbvUHFMlVnuwTiO0s7pQ1i584bpMKALKwTMNYh4=
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
        run: php artisan test --parallel
