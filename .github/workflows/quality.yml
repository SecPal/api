---
# SPDX-FileCopyrightText: 2025-2026 SecPal
# SPDX-License-Identifier: CC0-1.0

name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@6f8e13a7a62cee356811a7f58d6b92119941652f

  license-compatibility:
    name: Check License Compatibility
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434

  prettier:
    name: Formatting Check
    uses: ./.github/workflows/reusable-prettier.yml

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@6f8e13a7a62cee356811a7f58d6b92119941652f
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  ai-instructions:
    name: AI Instructions
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@6f8e13a7a62cee356811a7f58d6b92119941652f
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  pint:
    name: Laravel Pint
    uses: SecPal/.github/.github/workflows/reusable-php-lint.yml@6f8e13a7a62cee356811a7f58d6b92119941652f
    with:
      php-version: "8.4"

  phpstan:
    name: PHPStan
    uses: SecPal/.github/.github/workflows/reusable-php-stan.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434
    with:
      php-version: "8.4"

  # NOTE: PEST tests are owned by .github/workflows/php-ci.yml (job: `test`,
  # context: `PEST Tests`). Do not re-add a PEST job here — duplicate
  # required-check context names confuse GitHub branch-protection gates.
  # See: https://github.com/SecPal/api/issues/1157
