# SPDX-License-Identifier: CC0-1.0

name: Container Image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "tests/docker/**"
      - "tests/container/**"
      - "tests/fixtures/**"
      - "tests/Policy/**"
      - "tests/Feature/Console/ScheduleListWithoutDatabaseTest.php"
      - "tests/Regression/ContainerPolicyIsolationTest.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "tests/Pest.php"
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "lang/**"
      - "public/**"
      - "resources/**"
      - "routes/**"
      - "storage/**"
      - "scripts/ots-*.py"
      - "scripts/promote-ghcr-index.sh"
      - "artisan"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "LICENSES/**"
      - ".github/workflows/container-image.yml"
      - ".github/workflows/publish-container.yml"

permissions:
  contents: read
jobs:
  build-and-test:
    name: Build and integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        # 2.37.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:2.10.2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run database-free container policy tests
        run: composer test:container-policy

      - name: Lint Dockerfile
        run: >-
          docker run --rm -i
          hadolint/hadolint:v2.14.0-debian@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2
          < Dockerfile

      - name: Lint container scripts
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          docker/healthchecks/http-live.sh
          scripts/promote-ghcr-index.sh
          tests/container/promote-ghcr-index-contract.sh
          tests/docker/smoke.sh
          tests/fixtures/fake-ghcr-curl.sh

      - name: Test GHCR index promotion contract
        run: tests/container/promote-ghcr-index-contract.sh

      - name: Build and test the API image
        run: tests/docker/smoke.sh
