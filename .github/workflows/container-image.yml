---
name: "Container Image \u2014 qualification 1623"
"on":
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  build-and-test:
    name: Reused native ${{ matrix.distribution }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: bookworm
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-bookworm@sha256:49369ff211d81dc30a15890d58c0651d639aef0d9c0a9b91bcc6f387a77bd7a2
            arch: amd64
            runner: ubuntu-24.04
            artifact: api-compare-bookworm-amd64-39806314149-1
          - distribution: bookworm
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-bookworm@sha256:49369ff211d81dc30a15890d58c0651d639aef0d9c0a9b91bcc6f387a77bd7a2
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: api-compare-bookworm-arm64-39806314149-1
          - distribution: trixie
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-trixie@sha256:0de5a32944f72c13b45d183e8e6c53546b8172cec21cc8599e24b12e0661506d
            arch: amd64
            runner: ubuntu-24.04
            artifact: api-compare-trixie-amd64-39806314149-1
          - distribution: trixie
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-trixie@sha256:0de5a32944f72c13b45d183e8e6c53546b8172cec21cc8599e24b12e0661506d
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: api-compare-trixie-arm64-39806314149-1
    steps:
      - name: Checkout exact API commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b50a06d38b66f8dd54c0e21b4ef7960d487b666
          persist-credentials: false
          path: source
      - name: Retrieve existing immutable native qualification image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/input
          run-id: 39806314149
          github-token: ${{ github.token }}
      - name: Install native distribution container tools
        run: "sudo apt-get update

          sudo apt-get install --yes --no-install-recommends buildah podman skopeo uidmap slirp4netns crun

          podman --version

          uname -m"
      - name: Verify and exercise existing exact native image without rebuilding
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run:
          "input=\"$RUNNER_TEMP/input\"\noutput=\"$RUNNER_TEMP/secpal-native/$NATIVE_ARCH\"\nmkdir\
          \ -p \"$output\"\ncase \"$NATIVE_ARCH:$(uname -m)\" in\n  amd64:x86_64|arm64:aarch64) ;;\n \
          \ *) exit 1 ;;\nesac\npython3 scripts/container-publisher.py source --root \"$PWD\" \\\n  --commit\
          \ 6b50a06d38b66f8dd54c0e21b4ef7960d487b666 --output \"$output/source-after.json\"\ncmp \"$input/source.json\"\
          \ \"$output/source-after.json\"\npython3 scripts/container-publisher.py record --layout \"$input/image\"\
          \ \\\n  --arch \"$NATIVE_ARCH\" --source \"$input/source.json\" \\\n  --bases \"$input/bases.json\"\
          \ --output \"$output/record.json\"\ncmp \"$input/record.json\" \"$output/record.json\"\nimage=\"\
          localhost/secpal-api:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$NATIVE_ARCH\"\npodman pull \"\
          oci:$input/image:api\"\npodman tag \"$(jq -er .subject.config_digest \"$input/record.json\"\
          )\" \"$image\"\npython3 - \"$input/executed-smoke.sh\" \"$output/executed-smoke.sh\" <<'PY'\n\
          import pathlib,sys\ntext=pathlib.Path(sys.argv[1]).read_text()\nassert text.count(\",uid=10001,gid=10001,mode=0750\"\
          )==7\ntext=text.replace(\",uid=10001,gid=10001,mode=0750\",\",mode=1777\")\npathlib.Path(sys.argv[2]).write_text(text)\n\
          PY\nSKIP_BUILD=1 IMAGE_TAG=\"$image\" EXPECTED_ARCH=\"$NATIVE_ARCH\" sh \"$output/executed-smoke.sh\"\
          \nfor item in packages php frankenphp linkage python; do\n  case \"$item\" in\n    packages)\
          \ podman run --rm \"$image\" dpkg-query -W '-f=${binary:Package}\\t${Version}\\t${Architecture}\\\
          n' ;;\n    php) podman run --rm \"$image\" php -r 'echo json_encode([\"php\"=>PHP_VERSION,\"\
          extensions\"=>get_loaded_extensions(),\"curl\"=>curl_version(),\"sqlite\"=>SQLite3::version(),\"\
          libxml\"=>LIBXML_DOTTED_VERSION], JSON_PRETTY_PRINT);' ;;\n    frankenphp) podman run --rm \"\
          $image\" frankenphp version ;;\n    linkage) podman run --rm \"$image\" sh -c 'ldd /usr/local/bin/php;\
          \ ldd /usr/local/bin/frankenphp' ;;\n    python) podman run --rm \"$image\" python3 -m pip list\
          \ --format=json ;;\n  esac > \"$output/$item.txt\"\ndone"
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql
          coverage: none
          tools: composer:2.10.2
      - name: Install unchanged development dependencies for existing runtime regressions
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Existing authentication session jobs and PostgreSQL regressions using actual image PHP
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run:
          "output=\"$RUNNER_TEMP/secpal-native/$NATIVE_ARCH\"\nimage=\"localhost/secpal-api:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$NATIVE_ARCH\"\
          \nmkdir -p storage/app/keys\nphp -r 'file_put_contents(\"storage/app/keys/kek.key\", sodium_crypto_secretbox_keygen());'\n\
          chmod 600 storage/app/keys/kek.key\napp_key=\"base64:$(openssl rand -base64 32 | tr -d '\\n')\"\
          \npodman run --rm --network host --user 0 \\\n  -v \"$PWD:/app:rw\" -v \"$output:/qualification:rw\"\
          \ \\\n  -e \"APP_KEY=$app_key\" -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 \\\n  -e DB_PORT=5432\
          \ -e DB_DATABASE=testing -e DB_USERNAME=testing \\\n  -e DB_PASSWORD=testing -e SECPAL_TEST_SCHEMA=public\
          \ \\\n  \"$image\" php vendor/bin/pest \\\n  tests/Feature/Auth tests/Feature/AuthTest.php tests/Feature/HealthCheckTest.php\
          \ \\\n  tests/Feature/Postgres18FixtureSemanticsTest.php \\\n  tests/Feature/PostgresRuntimeCoordinationTest.php\
          \ \\\n  tests/Feature/Jobs tests/Feature/OpenTimestampScheduleRegistrationTest.php \\\n  tests/Feature/OpenTimestampServiceIntegrationTest.php\
          \ \\\n  tests/Feature/OpenTimestampServiceTest.php \\\n  tests/Unit/Scripts/OtsStampHashRuntimeTest.php\
          \ \\\n  tests/Unit/Scripts/OtsUpgradeRuntimeTest.php \\\n  tests/Unit/Services/OpenTimestampCliVerificationTest.php\
          \ \\\n  tests/Unit/Services/OpenTimestampPythonVerifierTest.php \\\n  --log-junit /qualification/compatibility-junit.xml"
      - name: Retain exact native OCI and SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name:
            api-compatibility-${{ matrix.distribution }}-${{ matrix.arch }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: ${{ runner.temp }}/secpal-native/${{ matrix.arch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
        if: always()
    defaults:
      run:
        working-directory: source
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        options:
          --health-cmd="pg_isready -U testing" --health-interval 10s --health-timeout 5s --health-retries
          5
        ports:
          - 5432:5432
