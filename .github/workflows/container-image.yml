---
name: "Container Image \u2014 qualification 1623"
"on":
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  build-and-test:
    name: Reused native ${{ matrix.distribution }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: bookworm
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-bookworm@sha256:49369ff211d81dc30a15890d58c0651d639aef0d9c0a9b91bcc6f387a77bd7a2
            arch: amd64
            runner: ubuntu-24.04
            artifact: api-compare-bookworm-amd64-39806314149-1
          - distribution: bookworm
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-bookworm@sha256:49369ff211d81dc30a15890d58c0651d639aef0d9c0a9b91bcc6f387a77bd7a2
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: api-compare-bookworm-arm64-39806314149-1
    steps:
      - name: Checkout exact API commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b50a06d38b66f8dd54c0e21b4ef7960d487b666
          persist-credentials: false
          path: source
      - name: Retrieve existing immutable native qualification image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/input
          run-id: 39806314149
          github-token: ${{ github.token }}
      - name: Install native distribution container tools
        run: "sudo apt-get update

          sudo apt-get install --yes --no-install-recommends buildah podman skopeo uidmap slirp4netns
          crun

          podman --version

          uname -m"
      - name: Verify unchanged Bookworm artifact and focused TLS fixture correction
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run:
          "input=\"$RUNNER_TEMP/input\"\noutput=\"$RUNNER_TEMP/secpal-native/$NATIVE_ARCH\"\nmkdir\
          \ -p \"$output\"\ncase \"$NATIVE_ARCH:$(uname -m)\" in\n  amd64:x86_64|arm64:aarch64) ;;\n \
          \ *) exit 1 ;;\nesac\npython3 scripts/container-publisher.py source --root \"$PWD\" \\\n  --commit\
          \ 6b50a06d38b66f8dd54c0e21b4ef7960d487b666 --output \"$output/source-after.json\"\ncmp \"$input/source.json\"\
          \ \"$output/source-after.json\"\npython3 scripts/container-publisher.py record --layout \"$input/image\"\
          \ \\\n  --arch \"$NATIVE_ARCH\" --source \"$input/source.json\" \\\n  --bases \"$input/bases.json\"\
          \ --output \"$output/record.json\"\npython3 - \"$input/record.json\" \"$output/record.json\"\
          \ <<'PY'\nimport json,sys\noriginal,observed=(json.load(open(p)) for p in sys.argv[1:])\nassert\
          \ original[\"workflow_run_id\"]==\"39806314149\"\nfor key in (\"workflow_run_id\",\"workflow_run_attempt\"\
          ):\n original.pop(key);observed.pop(key)\nassert original==observed\nPY\nimage=\"localhost/secpal-api:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$NATIVE_ARCH\"\
          \npodman pull \"oci:$input/image:api\"\npodman tag \"$(jq -er .subject.config_digest \"$input/record.json\"\
          )\" \"$image\"\n\nfixture=\"$RUNNER_TEMP/tls-fixture\"\nmkdir -p \"$fixture/scripts\" \"$fixture/tests/Unit/Scripts\"\
          \ncp scripts/ots-upgrade.py \"$fixture/scripts/\"\ncp tests/Unit/Scripts/OtsUpgradeTest.py \"\
          $fixture/tests/Unit/Scripts/\"\npython3 - \"$fixture/tests/Unit/Scripts/OtsUpgradeTest.py\"\
          \ \"$output/fixture-change.json\" <<'PY'\nimport pathlib,sys,hashlib,json,difflib\np=pathlib.Path(sys.argv[1]);original=p.read_text()\n\
          assert original.count(\"        class FakeTlsContext:\\n\")==1\nupdated=original.replace(\"\
          \        class FakeTlsContext:\\n\", \"        class FakeTlsContext:\\n            verify_mode\
          \ = 2  # ssl.CERT_REQUIRED\\n            check_hostname = True\\n\")\np.write_text(updated)\n\
          pathlib.Path(sys.argv[2]).write_text(json.dumps({\"scope\":\"test-double-only; image and production\
          \ source unchanged\",\"original_sha256\":hashlib.sha256(original.encode()).hexdigest(),\"qualified_fixture_sha256\"\
          :hashlib.sha256(updated.encode()).hexdigest(),\"diff\":\"\".join(difflib.unified_diff(original.splitlines(True),updated.splitlines(True)))},indent=2)+\"\
          \\n\")\nPY\nchmod -R a+rX \"$fixture\"\npodman run --rm --network=none --read-only --cap-drop=ALL\
          \ \\\n  --security-opt=no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777\
          \ \\\n  -v \"$fixture:/qualification:ro\" -w /qualification \\\n  \"$image\" python3 -B -m unittest\
          \ tests/Unit/Scripts/OtsUpgradeTest.py \\\n  > \"$output/focused-tls.stdout\" 2> \"$output/focused-tls.stderr\"\
          \npodman run --rm --network=none --read-only --cap-drop=ALL \\\n  --security-opt=no-new-privileges\
          \ \"$image\" python3 -c \\\n  'import runpy,ssl,socket; d=runpy.run_path(\"/app/scripts/ots-upgrade.py\"\
          ,run_name=\"qualify\"); c=d[\"PinnedHTTPSConnection\"](\"alice.calendar.opentimestamps.org\"\
          ,443,[(socket.AF_INET,socket.SOCK_STREAM,socket.IPPROTO_TCP,(\"93.184.216.34\",443))],2); assert\
          \ c._context.verify_mode == ssl.CERT_REQUIRED and c._context.check_hostname; print(\"REAL_TLS_CONTEXT_PASS;\
          \ no network connection made\")' \\\n  > \"$output/real-tls-context.txt\"\ncat \"$output/focused-tls.stderr\"\
          \ \"$output/real-tls-context.txt\"\n"
      - name: Retain exact native OCI and SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-tls-fixture-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secpal-native/${{ matrix.arch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
        if: always()
    defaults:
      run:
        working-directory: source
