---
name: "Container Image \u2014 qualification 1623"
"on":
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-and-test:
    name: Qualification ${{ matrix.distribution }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: bookworm
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-bookworm@sha256:49369ff211d81dc30a15890d58c0651d639aef0d9c0a9b91bcc6f387a77bd7a2
            arch: amd64
            runner: ubuntu-24.04
          - distribution: bookworm
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-bookworm@sha256:49369ff211d81dc30a15890d58c0651d639aef0d9c0a9b91bcc6f387a77bd7a2
            arch: arm64
            runner: ubuntu-24.04-arm
          - distribution: trixie
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-trixie@sha256:0de5a32944f72c13b45d183e8e6c53546b8172cec21cc8599e24b12e0661506d
            arch: amd64
            runner: ubuntu-24.04
          - distribution: trixie
            base: docker.io/dunglas/frankenphp:1.13.2-php8.4.27-trixie@sha256:0de5a32944f72c13b45d183e8e6c53546b8172cec21cc8599e24b12e0661506d
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact API commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b50a06d38b66f8dd54c0e21b4ef7960d487b666
          persist-credentials: false
          path: source
      - name: Checkout accepted supply-chain implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 6a6758681f4ebc46b4a33d442846d33d6b79785c
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Install native distribution container tools
        run: "sudo apt-get update

          sudo apt-get install --yes --no-install-recommends buildah podman skopeo uidmap slirp4netns
          crun

          buildah --version

          podman --version

          dpkg-query -W buildah podman skopeo"
      - name: Install pinned authoritative Syft
        run: scripts/container-tools.sh build "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Build unchanged API source with qualification-only base override
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
          QUALIFICATION_BASE: ${{ matrix.base }}
          QUALIFICATION_DIST: ${{ matrix.distribution }}
          QUALIFICATION_SOURCE: 6b50a06d38b66f8dd54c0e21b4ef7960d487b666
        run:
          "python3 - <<'PY'\nimport hashlib, json, os, pathlib, subprocess\nos.environ[\"GITHUB_SHA\"\
          ] = os.environ[\"QUALIFICATION_SOURCE\"]\nsource = pathlib.Path(\"scripts/build-container.sh\"\
          ).read_text()\nanchor = 'python3 scripts/container-publisher.py bases --root \"$snapshot\"'\n\
          assert source.count(anchor) == 1\noverride = r'''qualification_base_root=\"$snapshot_parent/qualified-base\"\
          \nmkdir \"$qualification_base_root\"\npython3 - \"$snapshot/Containerfile\" \"$qualification_base_root/Containerfile\"\
          \ \"$QUALIFICATION_BASE\" <<'OVERRIDE'\nimport pathlib, sys\noriginal = pathlib.Path(sys.argv[1]).read_bytes()\n\
          lines = original.decode().splitlines(keepends=True)\nassert sum(x.startswith(\"ARG FRANKENPHP_IMAGE=\"\
          ) for x in lines) == 1\nupdated = \"\".join(\"ARG FRANKENPHP_IMAGE=\"+sys.argv[3]+\"\\n\" if\
          \ x.startswith(\"ARG FRANKENPHP_IMAGE=\") else x for x in lines)\npathlib.Path(sys.argv[2]).write_text(updated)\n\
          assert pathlib.Path(sys.argv[1]).read_bytes() == original\nOVERRIDE\n'''\nsource = source.replace(anchor,\
          \ override + anchor.replace('\"$snapshot\"', '\"$qualification_base_root\"'))\nsmoke = pathlib.Path(\"\
          tests/docker/smoke.sh\").read_text()\nconfig = json.loads(subprocess.check_output([\"skopeo\"\
          , \"inspect\", \"--config\", \"docker://\"+os.environ[\"QUALIFICATION_BASE\"].split(\":\")[0]+\"\
          @\"+os.environ[\"QUALIFICATION_BASE\"].split(\"@\")[1]], text=True))\nenvironment = dict(x.split(\"\
          =\",1) for x in config[\"config\"][\"Env\"])\nversion = config[\"config\"][\"Labels\"][\"org.opencontainers.image.version\"\
          ]\nassert environment[\"PHP_VERSION\"].startswith(\"8.4.\")\nsmoke = smoke.replace(\"'PHP 8.4.23'\"\
          , repr(\"PHP \"+environment[\"PHP_VERSION\"]))\nsmoke = smoke.replace(\"'FrankenPHP v1.12.6'\"\
          , repr(\"FrankenPHP \"+version))\n\nrestriction = \" --read-only --cap-drop ALL --security-opt\
          \ no-new-privileges\"\nrestriction += \" --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777\"\
          \nfor path in (\"/config/caddy\",\"/data/caddy\",\"/app/storage/framework/cache/data\",\"/app/storage/framework/sessions\"\
          ,\"/app/storage/framework/views\",\"/app/storage/logs\",\"/app/bootstrap/cache\"):\n restriction\
          \ += \" --tmpfs \"+path+\":rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0750\"\n\
          target='podman run -d --name \"$api\" --network \"$network\"'\nassert smoke.count(target)==1\n\
          smoke=smoke.replace(target,'podman run -d'+restriction+' --name \"$api\" --network \"$network\"\
          ')\n\ntemporary = pathlib.Path(os.environ[\"RUNNER_TEMP\"])\nsmoke_file = temporary/\"qualified-smoke.sh\"\
          \nsmoke_file.write_text(smoke); smoke_file.chmod(0o700)\nsource = source.replace('tests/docker/smoke.sh',\
          \ str(smoke_file))\nbuild = temporary/\"qualified-build.sh\"\nbuild.write_text(source); build.chmod(0o700)\n\
          output = temporary/\"secpal-native\"/os.environ[\"NATIVE_ARCH\"]\noutput.mkdir(parents=True,exist_ok=True)\n\
          record = {\"scope\":\"QUALIFICATION_ONLY_NOT_A_RELEASE\",\"source\":os.environ[\"GITHUB_SHA\"\
          ],\"base\":os.environ[\"QUALIFICATION_BASE\"],\"distribution\":os.environ[\"QUALIFICATION_DIST\"\
          ],\"architecture\":os.environ[\"NATIVE_ARCH\"],\"build_process\":\"existing scripts/build-container.sh;\
          \ only resolved base inputs and test expectations adapted\",\"original_build_sha256\":hashlib.sha256(pathlib.Path(\"\
          scripts/build-container.sh\").read_bytes()).hexdigest(),\"executed_build_sha256\":hashlib.sha256(build.read_bytes()).hexdigest()}\n\
          (output/\"qualification.json\").write_text(json.dumps(record,indent=2)+\"\\n\")\n(output/\"\
          executed-build.sh\").write_text(source)\n(output/\"executed-smoke.sh\").write_text(smoke)\n\
          result = subprocess.run([\"bash\",str(build),os.environ[\"NATIVE_ARCH\"],str(output)])\nrecord[\"\
          build_and_smoke_exit\"]=result.returncode\n(output/\"qualification.json\").write_text(json.dumps(record,indent=2)+\"\
          \\n\")\nif result.returncode: raise SystemExit(result.returncode)\nimage=\"localhost/secpal-api:build-\"\
          +os.environ[\"GITHUB_RUN_ID\"]+\"-\"+os.environ[\"GITHUB_RUN_ATTEMPT\"]+\"-\"+os.environ[\"\
          NATIVE_ARCH\"]\ncommands = {\n \"packages\":[\"dpkg-query\",\"-W\",\"-f=${binary:Package}\\\
          t${Version}\\t${Architecture}\\n\"],\n \"php\":[\"php\",\"-r\",\"echo json_encode(['php'=>PHP_VERSION,'extensions'=>get_loaded_extensions(),'curl'=>curl_version(),'sqlite'=>SQLite3::version(),'libxml'=>LIBXML_DOTTED_VERSION],\
          \ JSON_PRETTY_PRINT);\"],\n \"frankenphp\":[\"frankenphp\",\"version\"],\n \"linkage\":[\"sh\"\
          ,\"-c\",\"ldd /usr/local/bin/php; ldd /usr/local/bin/frankenphp\"],\n \"python\":[\"python3\"\
          ,\"-m\",\"pip\",\"list\",\"--format=json\"],\n}\nfor name,args in commands.items():\n r=subprocess.run([\"\
          podman\",\"run\",\"--rm\",image]+args,capture_output=True,text=True)\n (output/(name+\".txt\"\
          )).write_text(r.stdout)\n (output/(name+\"-stderr.txt\")).write_text(r.stderr)\n if r.returncode:\
          \ raise SystemExit(name+\" inventory failed\")\nPY\n"
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql
          coverage: none
          tools: composer:2.10.2
      - name: Install unchanged development dependencies for existing runtime regressions
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Existing authentication session jobs and PostgreSQL regressions using actual image PHP
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run:
          "output=\"$RUNNER_TEMP/secpal-native/$NATIVE_ARCH\"\nimage=\"localhost/secpal-api:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$NATIVE_ARCH\"\
          \nmkdir -p storage/app/keys\nphp -r 'file_put_contents(\"storage/app/keys/kek.key\", sodium_crypto_secretbox_keygen());'\n\
          chmod 600 storage/app/keys/kek.key\napp_key=\"base64:$(openssl rand -base64 32 | tr -d '\\n')\"\
          \npodman run --rm --network host --user 0 \\\n  -v \"$PWD:/app:rw\" -v \"$output:/qualification:rw\"\
          \ \\\n  -e \"APP_KEY=$app_key\" -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 \\\n  -e DB_PORT=5432\
          \ -e DB_DATABASE=testing -e DB_USERNAME=testing \\\n  -e DB_PASSWORD=testing -e SECPAL_TEST_SCHEMA=public\
          \ \\\n  \"$image\" php vendor/bin/pest \\\n  tests/Feature/Auth tests/Feature/AuthTest.php tests/Feature/HealthCheckTest.php\
          \ \\\n  tests/Feature/Postgres18FixtureSemanticsTest.php \\\n  tests/Feature/PostgresRuntimeCoordinationTest.php\
          \ \\\n  tests/Feature/Jobs tests/Feature/OpenTimestampScheduleRegistrationTest.php \\\n  tests/Feature/OpenTimestampServiceIntegrationTest.php\
          \ \\\n  tests/Feature/OpenTimestampServiceTest.php \\\n  tests/Unit/Scripts/OtsStampHashRuntimeTest.php\
          \ \\\n  tests/Unit/Scripts/OtsUpgradeRuntimeTest.php \\\n  tests/Unit/Services/OpenTimestampCliVerificationTest.php\
          \ \\\n  tests/Unit/Services/OpenTimestampPythonVerifierTest.php \\\n  --log-junit /qualification/compatibility-junit.xml"
      - name: Retain exact native OCI and SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name:
            api-compare-${{ matrix.distribution }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt
            }}
          path: ${{ runner.temp }}/secpal-native/${{ matrix.arch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
        if: always()
    defaults:
      run:
        working-directory: source
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        options:
          --health-cmd="pg_isready -U testing" --health-interval 10s --health-timeout 5s --health-retries
          5
        ports:
          - 5432:5432
