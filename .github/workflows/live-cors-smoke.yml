name: Live CORS Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  live-cors-smoke:
    name: Live CORS Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check live API CORS headers
        env:
          API_URL: https://api.secpal.dev
          SPA_ORIGIN: https://app.secpal.dev
        run: ./scripts/check-live-cors-health.sh
