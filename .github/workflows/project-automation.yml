---
name: Project Board Automation

on:
  issues:
    types:
      - opened
      - reopened
      - closed
      - labeled
  pull_request:
    types:
      - opened
      - ready_for_review
      - closed
      - converted_to_draft
      - labeled
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  project-automation:
    name: Project automation
    uses: SecPal/.github/.github/workflows/project-automation-core.yml@1e32f4903bb62943eaf77bed9550bade29c8076f
    secrets: inherit

  draft-reminder:
    name: Draft PR Reminder
    if: github.event_name == 'pull_request'
    uses: SecPal/.github/.github/workflows/draft-pr-reminder.yml@1e32f4903bb62943eaf77bed9550bade29c8076f
    permissions:
      issues: write
      pull-requests: write
