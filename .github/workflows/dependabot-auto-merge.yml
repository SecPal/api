---
# Dependabot Auto-Merge Workflow (API Repository)
# Uses the centralized reusable workflow from .github repository
#
# For implementation details, see:
# SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml

name: Dependabot Auto-Merge

on:
  # Execute only the accepted immutable callee; never PR-controlled code.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - edited
      - converted_to_draft

# Ensure only one auto-merge runs at a time per PR
concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Required permissions for dependabot auto-merge
cache-mode: none
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@31555f23d459031248006f77785d872bc3947127
    with:
      allowed-ecosystems: "github_actions,npm_and_yarn,composer"
      phase: "2" # Verified PATCH and MINOR; Source Safety must be required
      merge-method: "squash" # Use squash merge for cleaner history
