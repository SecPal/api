---
# Dependabot Auto-Merge Workflow (API Repository)
# Uses the centralized reusable workflow from .github repository
#
# For implementation details, see:
# SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml

name: Dependabot Auto-Merge

on:
  # Execute only the accepted immutable callee; never PR-controlled code.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - edited
      - converted_to_draft

# Ensure only one auto-merge runs at a time per PR
concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Required permissions for dependabot auto-merge
cache-mode: none
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@cbf343cf4521690f15157d6602a53ef9d0662ec7
    with:
      allowed-ecosystems: "github_actions,npm_and_yarn,composer,pip,pre_commit,docker"
      pip-manifest-path: "docker/python/opentimestamps-requirements.txt"
      pre-commit-path: ".pre-commit-config.yaml"
      docker-rules: >-
        [{"image":"library/composer","paths":["docker/php-fpm/Containerfile"],"line":"2","suffix":""},
         {"image":"library/php","paths":["docker/php-fpm/Containerfile"],"line":"8.4","suffix":"-fpm-alpine3.24","enforceLine":true},
         {"image":"library/nginx","paths":["docker/nginx/Containerfile"],"line":"1.30","suffix":"-alpine3.24-slim"}]
      phase: "2" # Verified PATCH and MINOR; Source Safety must be required
      merge-method: "squash" # Use squash merge for cleaner history
