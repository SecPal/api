name: API Repository Security

on:
  workflow_call:
    outputs:
      evidence-artifact:
        description: Exact same-run artifact emitted by the accepted source scanner.
        value: ${{ jobs.repository-security.outputs.evidence-artifact }}

permissions:
  contents: read

jobs:
  repository-security:
    name: Accept API Repository Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      evidence-artifact: ${{ steps.repository-scan.outputs.evidence-artifact }}
    steps:
      - name: Checkout exact API commit
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan the checked-out API repository
        id: repository-scan
        uses: SecPal/.github/.github/actions/trivy-repository-scan@f94b47c6a44f924b11b2802ac1c334f20b2e93a9

      - name: Require CLEAN repository evidence
        shell: bash
        env:
          GATE_STATE: ${{ steps.repository-scan.outputs.gate-state }}
        run: |
          set -euo pipefail
          test "${GATE_STATE:-}" = CLEAN
