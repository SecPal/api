---
name: Publish Container
"on":
  workflow_dispatch:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: publish-container-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false
env:
  GHCR_HOST: ghcr.io
  GHCR_REPOSITORY_PATH: secpal/api
  CANONICAL_IMAGE: ghcr.io/secpal/api
jobs:
  repository-security:
    name: Repository Security
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-repository-security.yml
  build:
    name: Build native API candidates
    needs:
      - repository-security
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/container-image.yml
  candidate:
    name: Attest unpublished API deployment candidate
    if: github.repository == 'SecPal/api' && github.ref == 'refs/heads/main' && github.ref_protected
    needs: [build, repository-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Require exact same-run artifact locators
        env:
          EVIDENCE_ID: ${{ needs.build.outputs.pre-registry-evidence-id }}
          SOURCE_ARTIFACT: ${{ needs.repository-security.outputs.evidence-artifact }}
        run: |
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$SOURCE_ARTIFACT"
      - name: Read exact same-run qualification
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.pre-registry-evidence-id }}
          path: candidate
      - name: Read independently accepted source evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.repository-security.outputs.evidence-artifact }}
          path: source-evidence
      - name: Bind exact source and qualification
        run: |
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
            .source.commit == $sha and .workflow.run_id == $run and .workflow.run_attempt == $attempt
            and .published == false and .qualification == "SUCCEEDED"
          ' candidate/unpublished-runtime-pair.json >/dev/null
          jq -e --arg sha "$GITHUB_SHA" '
            .subject == {repository: "SecPal/api", commit: $sha}
            and .operation == {name: "TRIVY_REPOSITORY_SCAN", status: "SUCCEEDED"}
            and .gate_state == "CLEAN" and .database.status == "FRESH"
          ' source-evidence/result.json >/dev/null
          cp -- source-evidence/result.json candidate/source-security.json
      - name: Sign qualified subjects before registry admission
        id: attestation
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            candidate/unpublished-runtime-pair.json
            candidate/source-security.json
            candidate/php-fpm/amd64/evaluation.json
            candidate/php-fpm/arm64/evaluation.json
            candidate/nginx/amd64/evaluation.json
            candidate/nginx/arm64/evaluation.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain signed candidate evidence
        env:
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: install -m 0600 "$BUNDLE" candidate/bundle.jsonl
      - name: Store candidate evidence in the same Actions run
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          if-no-files-found: error
          retention-days: 14
  prepare:
    if: github.event_name == 'workflow_dispatch'
    name: Prepare exact digest subjects
    needs:
      - build
      - repository-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      candidates: ${{ steps.prepare.outputs.candidates }}
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 4892b3248faac245047fdb1dc93fc77fc3d08e02
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Install native registry observer
        run: "sudo apt-get update

          sudo apt-get install --yes --no-install-recommends skopeo"
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Read same-run native artifacts
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/native
      - name: Require exact source evidence identity
        env:
          SOURCE_EVIDENCE_ARTIFACT: ${{ needs.repository-security.outputs.evidence-artifact }}
        run: test -n "$SOURCE_EVIDENCE_ARTIFACT"
      - name: Read exact source security evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: .context/repository-security
          name: ${{ needs.repository-security.outputs.evidence-artifact }}
      - name: Require successful pre-registry qualification
        env:
          RELEASE_EVIDENCE_ID: ${{ needs.build.outputs.pre-registry-evidence-id }}
        run: '[[ "$RELEASE_EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Read exact pre-registry evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.pre-registry-evidence-id }}
          path: .context/unpublished-release
      - name: Read currently accepted VEX data for independent replay
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: main
          path: .context/reviewed-vex
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked central policy dependencies
        run: 'python3 -m venv "$RUNNER_TEMP/secpal-policy"

          "$RUNNER_TEMP/secpal-policy/bin/pip" install --requirement .context/publisher-governance/requirements/vulnerability-policy.txt

          printf ''%s\n'' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"'
      - name: Publish and independently read exact subjects
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-container.sh prepare
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  attest:
    name: ${{ format('Attest candidate index platforms and Syft artifacts ({0})', matrix.component) }}
    strategy:
      fail-fast: false
      matrix:
        component: [php-fpm, nginx]
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Select ephemeral attestation credential directory
        run: printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/secpal-attest-auth" >> "$GITHUB_ENV"
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Authenticate exact package for keyless attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'python3 scripts/container-attestation-auth.py prepare

          printf ''%s'' "$GH_TOKEN" | "$RUNNER_TEMP/secpal-publisher-tools/oras" login ghcr.io --registry-config "$DOCKER_CONFIG/config.json"
          --username "$GITHUB_ACTOR" --password-stdin

          chmod 0600 "$DOCKER_CONFIG/config.json"'
      - name: Admit exact job credential to pinned reader
        run: python3 scripts/container-attestation-auth.py install
      - name: Attest exact index
        id: index
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ fromJSON(needs.prepare.outputs.candidates)[matrix.component].index_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact amd64
        id: amd64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ fromJSON(needs.prepare.outputs.candidates)[matrix.component].amd64_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact arm64
        id: arm64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ fromJSON(needs.prepare.outputs.candidates)[matrix.component].arm64_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact sbom-amd64
        id: sbom-amd64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ fromJSON(needs.prepare.outputs.candidates)[matrix.component].amd64_sbom_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact sbom-arm64
        id: sbom-arm64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ fromJSON(needs.prepare.outputs.candidates)[matrix.component].arm64_sbom_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Remove exact ephemeral registry credentials
        if: always()
        run: python3 scripts/container-attestation-auth.py cleanup
  verify:
    name: Published native runtime (${{ matrix.arch }})
    needs:
      - prepare
      - attest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 4892b3248faac245047fdb1dc93fc77fc3d08e02
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Read exact prepared subjects
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          merge-multiple: true
      - name: Read qualified production secret contract
        if: github.event_name == 'workflow_dispatch'
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/deployment
          ref: bf2282e3e112ac003360ecb3dff390eafe282dbd
          path: .context/runtime-contracts
          persist-credentials: false
      - name: Install native runtime client
        run: "sudo apt-get update

          sudo apt-get install --yes --no-install-recommends podman uidmap slirp4netns crun"
      - name: Install pinned native GitHub verifier
        run: scripts/container-tools.sh verify "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Verify attestation and execute exact native platform
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARCH: ${{ matrix.arch }}
        run: scripts/publish-container.sh verify "$NATIVE_ARCH"
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-smoke-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/smoke
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  scan:
    name: Verify authoritative SPDX and independent artifact scans
    needs:
      - prepare
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refresh exact source security without rebuilding
        id: source-scan
        uses: SecPal/.github/.github/actions/trivy-repository-scan@73e2972e8856c8c197152ec3b45a63e49ccb09fe
      - name: Read refreshed source evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.source-scan.outputs.evidence-artifact }}
          path: .context/scan/source
      - name: Require fresh CLEAN source evidence
        env:
          GATE_STATE: ${{ steps.source-scan.outputs.gate-state }}
        run: test "$GATE_STATE" = CLEAN
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 4892b3248faac245047fdb1dc93fc77fc3d08e02
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Read exact prepared subjects
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-prepared-${{ github.run_id }}-*
          path: .context/publisher
          merge-multiple: true
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh publish "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Install locked central policy dependencies
        run: 'python3 -m venv "$RUNNER_TEMP/secpal-policy"

          "$RUNNER_TEMP/secpal-policy/bin/pip" install --requirement .context/publisher-governance/requirements/vulnerability-policy.txt

          printf ''%s\n'' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"'
      - name: Read accepted protected-main VEX data independently of build inputs
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: main
          path: .context/reviewed-vex
          persist-credentials: false
          fetch-depth: 0
      - name: Observe exact artifacts and apply accepted central policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/scan-container-artifact.sh published
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-scans-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/scan
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  accept:
    name: Accept verified API publication
    needs:
      - prepare
      - attest
      - verify
      - scan
      - repository-security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      evidence_digest: ${{ steps.retain.outputs.evidence_digest }}
      runtime_pair_digest: ${{ steps.accept.outputs.runtime_pair_digest }}
    steps:
      - name: Select ephemeral attestation credential directory
        run: printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/secpal-final-attest-auth" >> "$GITHUB_ENV"
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 4892b3248faac245047fdb1dc93fc77fc3d08e02
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Read accepted protected-main VEX data independently of build inputs
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: main
          path: .context/reviewed-vex
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate original candidate attempt
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/container-publisher.py candidate-context --output .context/publisher-candidate-context.json
      - name: Read exact prepared subjects
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-prepared-${{ github.run_id }}-${{ steps.candidate.outputs.candidate_attempt }}
          path: .context/publisher
          merge-multiple: true
      - name: Read exact native scan evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-scans-${{ github.run_id }}-${{ steps.candidate.outputs.scan_attempt }}
          path: .context/scan
          merge-multiple: true
      - name: Read exact native smoke evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-smoke-*-${{ github.run_id }}-${{ steps.candidate.outputs.candidate_attempt }}
          path: .context/smoke
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Install locked central policy dependencies
        run: 'python3 -m venv "$RUNNER_TEMP/secpal-policy"

          "$RUNNER_TEMP/secpal-policy/bin/pip" install --requirement .context/publisher-governance/requirements/vulnerability-policy.txt

          printf ''%s\n'' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"'
      - name: Assemble complete builder-independent evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-container.sh evidence
      - name: Attest immutable build evidence document
        id: document
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            .context/publisher/runtime-pair.json
            .context/publisher/php-fpm/build-evidence.json
            .context/publisher/nginx/build-evidence.json
          create-storage-record: false
      - name: Verify exact document and retain its bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.document.outputs.bundle-path }}
        run: |
          for document in .context/publisher/runtime-pair.json .context/publisher/{php-fpm,nginx}/build-evidence.json; do
            gh attestation verify "$document" --bundle "$BUNDLE" --repo SecPal/api --signer-workflow SecPal/api/.github/workflows/publish-container.yml \
              --signer-digest "$GITHUB_SHA" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          cp "$BUNDLE" .context/publisher/build-evidence.bundle.json
      - name: Retain immutable evidence by digest
        id: retain
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-container.sh retain-evidence
      - name: Authenticate exact package for evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'python3 scripts/container-attestation-auth.py prepare

          printf ''%s'' "$GH_TOKEN" | "$RUNNER_TEMP/secpal-publisher-tools/oras" login ghcr.io --registry-config "$DOCKER_CONFIG/config.json"
          --username "$GITHUB_ACTOR" --password-stdin

          chmod 0600 "$DOCKER_CONFIG/config.json"'
      - name: Admit exact job credential to pinned reader
        run: python3 scripts/container-attestation-auth.py install
      - name: Attest exact build-evidence
        id: build-evidence
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ steps.retain.outputs.evidence_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Restore and remove exact evidence attestation credentials
        if: always()
        run: python3 scripts/container-attestation-auth.py cleanup
      - name: Verify all subjects and publish only unique discovery tag
        id: accept
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DIGEST: ${{ steps.retain.outputs.evidence_digest }}
        run: scripts/publish-container.sh accept "$EVIDENCE_DIGEST"
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-accepted-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
