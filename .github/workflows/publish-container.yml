---
# SPDX-FileCopyrightText: 2026 SecPal Contributors
# SPDX-License-Identifier: CC0-1.0

name: Publish Container
on:
  push:
    branches: [main]

permissions: {}

env:
  GHCR_HOST: ghcr.io
  GHCR_REPOSITORY_PATH: secpal/api
  CANONICAL_IMAGE: ghcr.io/secpal/api

jobs:
  validate:
    name: Validate API Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: publish-container-validate-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Checkout publishing commit
        id: checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up PHP
        # 2.37.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run container policy tests
        run: php artisan test tests/Unit/ContainerImageDefinitionTest.php tests/Unit/ContainerPublishingWorkflowTest.php

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0-debian < Dockerfile

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint container scripts
        run: shellcheck docker/healthchecks/http-live.sh tests/docker/smoke.sh

      - name: Build and test the API image
        run: tests/docker/smoke.sh

  publish:
    name: Publish API Image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    concurrency:
      group: publish-container-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout publishing commit
        id: checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        id: registry-login
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.GHCR_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable SHA tag
        id: existing-image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image_tag="sha-${GITHUB_SHA}"
          manifest_file=$(mktemp)
          trap 'rm -f "$manifest_file"' EXIT
          registry_token=$(curl --fail --silent --show-error \
            --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            --get \
            --data-urlencode "scope=repository:${GHCR_REPOSITORY_PATH}:pull" \
            --data-urlencode "service=${GHCR_HOST}" \
            "https://${GHCR_HOST}/token" | jq -er '.token')
          status=$(curl --silent --show-error \
            --output "$manifest_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://${GHCR_HOST}/v2/${GHCR_REPOSITORY_PATH}/manifests/${image_tag}")
          case "$status" in
            200)
              jq -e '.mediaType == "application/vnd.oci.image.index.v1+json"' "$manifest_file"
              digest="sha256:$(sha256sum "$manifest_file" | awk '{print $1}')"
              digest_ref="${CANONICAL_IMAGE}@${digest}"
              existing_manifest=$(docker buildx imagetools inspect "$digest_ref" \
                --format '{{json .Manifest}}')
              printf '%s\n' "$existing_manifest" | jq -e '
                ([.manifests[]
                  | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                  | "\(.platform.os)/\(.platform.architecture)"] | sort)
                  == ["linux/amd64", "linux/arm64"]
              '
              for platform in linux/amd64 linux/arm64; do
                image_config=$(docker buildx imagetools inspect "$digest_ref" \
                  --format "{{json (index .Image \"${platform}\")}}")
                printf '%s\n' "$image_config" | jq -e \
                  --arg source 'https://github.com/SecPal/api' \
                  --arg revision "$GITHUB_SHA" '
                    .config.Labels["org.opencontainers.image.source"] == $source
                    and .config.Labels["org.opencontainers.image.revision"] == $revision
                  '
              done
              printf 'exists=true\ndigest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
              ;;
            404)
              printf 'exists=false\ndigest=\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'GHCR manifest lookup failed with HTTP status %s\n' "$status" >&2
              exit 1
              ;;
          esac

      - name: Set up QEMU
        if: steps.existing-image.outputs.exists == 'false'
        # v4.2.0
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          platforms: arm64

      - name: Record creation timestamp
        id: metadata
        if: steps.existing-image.outputs.exists == 'false'
        run: printf 'created=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable image
        id: build
        if: steps.existing-image.outputs.exists == 'false'
        # v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.CANONICAL_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SecPal/api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=SecPal API
            org.opencontainers.image.description=Production API for SecPal operations software
            org.opencontainers.image.licenses=AGPL-3.0-or-later AND LicenseRef-SecPal-Attribution
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
          sbom: true
          provenance: mode=max

      - name: Select published image digest
        id: image
        env:
          EXISTING_IMAGE_DIGEST: ${{ steps.existing-image.outputs.digest }}
          BUILT_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "${{ steps.existing-image.outputs.exists }}" = true ]; then
            digest=$EXISTING_IMAGE_DIGEST
          else
            digest=$BUILT_IMAGE_DIGEST
          fi
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub artifact attestation
        id: attest
        # v4.2.1
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-name: ${{ env.CANONICAL_IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  verify:
    name: Verify Published API Image
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout publishing commit
        id: checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        id: registry-login
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.GHCR_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify remote index and BuildKit attestations
        run: |
          set -euo pipefail
          DIGEST_REF="${CANONICAL_IMAGE}@${IMAGE_DIGEST}"
          tag_digest="sha256:$(docker buildx imagetools inspect "$CANONICAL_IMAGE:$IMAGE_TAG" --raw \
            | sha256sum | awk '{print $1}')"
          test "$tag_digest" = "$IMAGE_DIGEST"
          tag_manifest=$(docker buildx imagetools inspect "$CANONICAL_IMAGE:$IMAGE_TAG" --format '{{json .Manifest}}')
          printf '%s\n' "$tag_manifest" | jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json"
            and ([.manifests[]
              | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
              | "\(.platform.os)/\(.platform.architecture)"] | sort)
              == ["linux/amd64", "linux/arm64"]
            and ([.manifests[]
              | select((.annotations["vnd.docker.reference.type"] // "") == "attestation-manifest")]
              | length) == 2
            and all(.manifests[]
              | select((.annotations["vnd.docker.reference.type"] // "") == "attestation-manifest");
              .platform.os == "unknown" and .platform.architecture == "unknown")
          '
          for platform in linux/amd64 linux/arm64; do
            image_config=$(docker buildx imagetools inspect "$DIGEST_REF" \
              --format "{{json (index .Image \"${platform}\")}}")
            printf '%s\n' "$image_config" | jq -e \
              --arg source 'https://github.com/SecPal/api' \
              --arg revision "$GITHUB_SHA" '
                .config.Labels["org.opencontainers.image.source"] == $source
                and .config.Labels["org.opencontainers.image.revision"] == $revision
              '
            docker buildx imagetools inspect "$DIGEST_REF" \
              --format "{{json (index .SBOM \"${platform}\").SPDX}}" \
              | jq -e '.SPDXID == "SPDXRef-DOCUMENT" and (.packages | length) > 0'
            docker buildx imagetools inspect "$DIGEST_REF" \
              --format "{{json (index .Provenance \"${platform}\").SLSA}}" \
              | jq -e '
                .buildType == "https://mobyproject.org/buildkit@v1"
                and .metadata.completeness.parameters == true
                and .metadata.completeness.environment == true
                and .metadata.completeness.materials == true
              '
          done

      - name: Verify GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST_REF="${CANONICAL_IMAGE}@${IMAGE_DIGEST}"
          gh attestation verify "oci://$DIGEST_REF" \
            --repo SecPal/api \
            --signer-workflow SecPal/api/.github/workflows/publish-container.yml \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"

      - name: Smoke-test the published digest
        run: |
          set -euo pipefail
          DIGEST_REF="${CANONICAL_IMAGE}@${IMAGE_DIGEST}"
          docker pull "$DIGEST_REF"
          SKIP_BUILD=1 IMAGE_TAG="$DIGEST_REF" tests/docker/smoke.sh
