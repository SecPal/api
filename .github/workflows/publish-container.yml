---
name: Publish Container
"on":
  push:
    branches:
      - main
permissions: {}
concurrency:
  group: publish-container-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false
env:
  GHCR_HOST: ghcr.io
  GHCR_REPOSITORY_PATH: secpal/api
  CANONICAL_IMAGE: ghcr.io/secpal/api
jobs:
  repository-security:
    name: Repository Security
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-repository-security.yml
  build:
    name: Build native API candidates
    needs:
      - repository-security
    permissions:
      contents: read
    uses: ./.github/workflows/container-image.yml
  prepare:
    name: Prepare exact digest subjects
    needs:
      - build
      - repository-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.prepare.outputs.index_digest }}
      amd64_digest: ${{ steps.prepare.outputs.amd64_digest }}
      arm64_digest: ${{ steps.prepare.outputs.arm64_digest }}
      amd64_sbom: ${{ steps.prepare.outputs.amd64_sbom }}
      arm64_sbom: ${{ steps.prepare.outputs.arm64_sbom }}
      amd64_sbom_digest: ${{ steps.prepare.outputs.amd64_sbom_digest }}
      arm64_sbom_digest: ${{ steps.prepare.outputs.arm64_sbom_digest }}
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 57a1b7ce698a2ef7e253a05e6cf008b9fdab646c
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Install native registry observer
        run: "sudo apt-get update

          sudo apt-get install --yes --no-install-recommends skopeo"
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Read same-run native artifacts
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/native
      - name: Require exact source evidence identity
        env:
          SOURCE_EVIDENCE_ARTIFACT: ${{ needs.repository-security.outputs.evidence-artifact }}
        run: test -n "$SOURCE_EVIDENCE_ARTIFACT"
      - name: Read exact source security evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: .context/repository-security
          name: ${{ needs.repository-security.outputs.evidence-artifact }}
      - name: Install locked central policy dependencies
        run: 'python3 -m venv "$RUNNER_TEMP/secpal-policy"

          "$RUNNER_TEMP/secpal-policy/bin/pip" install --requirement .context/publisher-governance/requirements/vulnerability-policy.txt

          printf ''%s\n'' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"'
      - name: Publish and independently read exact subjects
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-container.sh prepare
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  attest:
    name: Attest candidate index platforms and Syft artifacts
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Select ephemeral attestation credential directory
        run: printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/secpal-attest-auth" >> "$GITHUB_ENV"
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Authenticate exact package for keyless attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'python3 scripts/container-attestation-auth.py prepare

          printf ''%s'' "$GH_TOKEN" | "$RUNNER_TEMP/secpal-publisher-tools/oras" login ghcr.io --registry-config "$DOCKER_CONFIG/config.json"
          --username "$GITHUB_ACTOR" --password-stdin

          chmod 0600 "$DOCKER_CONFIG/config.json"'
      - name: Admit exact job credential to pinned reader
        run: python3 scripts/container-attestation-auth.py install
      - name: Attest exact index
        id: index
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ needs.prepare.outputs.index_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact amd64
        id: amd64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ needs.prepare.outputs.amd64_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact arm64
        id: arm64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ needs.prepare.outputs.arm64_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact sbom-amd64
        id: sbom-amd64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ needs.prepare.outputs.amd64_sbom_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact sbom-arm64
        id: sbom-arm64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ needs.prepare.outputs.arm64_sbom_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Remove exact ephemeral registry credentials
        if: always()
        run: python3 scripts/container-attestation-auth.py cleanup
  verify:
    name: Published native runtime (${{ matrix.arch }})
    needs:
      - prepare
      - attest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 57a1b7ce698a2ef7e253a05e6cf008b9fdab646c
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Read exact prepared subjects
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          merge-multiple: true
      - name: Install native runtime client
        run: "sudo apt-get update

          sudo apt-get install --yes --no-install-recommends podman uidmap slirp4netns crun"
      - name: Install pinned native GitHub verifier
        run: scripts/container-tools.sh verify "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Verify attestation and execute exact native platform
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARCH: ${{ matrix.arch }}
        run: scripts/publish-container.sh verify "$NATIVE_ARCH"
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-smoke-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/smoke
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  scan:
    name: Verify authoritative SPDX and independent artifact scans
    needs:
      - prepare
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refresh exact source security without rebuilding
        id: source-scan
        uses: SecPal/.github/.github/actions/trivy-repository-scan@86c921a638669c7c9e9995bee276cf672e126bef
      - name: Read refreshed source evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.source-scan.outputs.evidence-artifact }}
          path: .context/scan/source
      - name: Require fresh CLEAN source evidence
        env:
          GATE_STATE: ${{ steps.source-scan.outputs.gate-state }}
        run: test "$GATE_STATE" = CLEAN
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 57a1b7ce698a2ef7e253a05e6cf008b9fdab646c
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Read exact prepared subjects
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-prepared-${{ github.run_id }}-*
          path: .context/publisher
          merge-multiple: true
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh publish "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Install locked central policy dependencies
        run: 'python3 -m venv "$RUNNER_TEMP/secpal-policy"

          "$RUNNER_TEMP/secpal-policy/bin/pip" install --requirement .context/publisher-governance/requirements/vulnerability-policy.txt

          printf ''%s\n'' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"'
      - name: Observe exact artifacts and apply accepted central policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/scan-container-artifact.sh
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-scans-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/scan
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  accept:
    name: Accept verified API publication
    needs:
      - prepare
      - attest
      - verify
      - scan
      - repository-security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_digest: ${{ needs.prepare.outputs.index_digest }}
      evidence_digest: ${{ steps.retain.outputs.evidence_digest }}
    steps:
      - name: Select ephemeral attestation credential directory
        run: printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/secpal-final-attest-auth" >> "$GITHUB_ENV"
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 57a1b7ce698a2ef7e253a05e6cf008b9fdab646c
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate original candidate attempt
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/container-publisher.py candidate-context --output .context/publisher-candidate-context.json
      - name: Read exact prepared subjects
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-prepared-${{ github.run_id }}-${{ steps.candidate.outputs.candidate_attempt }}
          path: .context/publisher
          merge-multiple: true
      - name: Read exact native scan evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-scans-${{ github.run_id }}-${{ steps.candidate.outputs.scan_attempt }}
          path: .context/scan
          merge-multiple: true
      - name: Read exact native smoke evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-smoke-*-${{ github.run_id }}-${{ steps.candidate.outputs.candidate_attempt }}
          path: .context/smoke
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Install locked central policy dependencies
        run: 'python3 -m venv "$RUNNER_TEMP/secpal-policy"

          "$RUNNER_TEMP/secpal-policy/bin/pip" install --requirement .context/publisher-governance/requirements/vulnerability-policy.txt

          printf ''%s\n'' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"'
      - name: Assemble complete builder-independent evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RISK_ACCEPTANCE_COMMENT_ID: ${{ vars.ARTIFACT_RISK_ACCEPTANCE_COMMENT_ID }}
        run: scripts/publish-container.sh evidence
      - name: Attest immutable build evidence document
        id: document
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .context/publisher/build-evidence.json
          create-storage-record: false
      - name: Verify exact document and retain its bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.document.outputs.bundle-path }}
        run:
          'gh attestation verify .context/publisher/build-evidence.json --bundle "$BUNDLE" --repo SecPal/api --signer-workflow
          SecPal/api/.github/workflows/publish-container.yml --signer-digest "$GITHUB_SHA" --source-ref refs/heads/main
          --source-digest "$GITHUB_SHA" --deny-self-hosted-runners

          cp "$BUNDLE" .context/publisher/build-evidence.bundle.json'
      - name: Retain immutable evidence by digest
        id: retain
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-container.sh retain-evidence
      - name: Authenticate exact package for evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'python3 scripts/container-attestation-auth.py prepare

          printf ''%s'' "$GH_TOKEN" | "$RUNNER_TEMP/secpal-publisher-tools/oras" login ghcr.io --registry-config "$DOCKER_CONFIG/config.json"
          --username "$GITHUB_ACTOR" --password-stdin

          chmod 0600 "$DOCKER_CONFIG/config.json"'
      - name: Admit exact job credential to pinned reader
        run: python3 scripts/container-attestation-auth.py install
      - name: Attest exact build-evidence
        id: build-evidence
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/api
          subject-digest: ${{ steps.retain.outputs.evidence_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Restore and remove exact evidence attestation credentials
        if: always()
        run: python3 scripts/container-attestation-auth.py cleanup
      - name: Verify all subjects and publish only unique discovery tag
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RISK_ACCEPTANCE_COMMENT_ID: ${{ vars.ARTIFACT_RISK_ACCEPTANCE_COMMENT_ID }}
          EVIDENCE_DIGEST: ${{ steps.retain.outputs.evidence_digest }}
        run: scripts/publish-container.sh accept "$EVIDENCE_DIGEST"
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-accepted-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
