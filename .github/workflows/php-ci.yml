name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Laravel Pint (PSR-12)
    uses: SecPal/.github/.github/workflows/reusable-php-lint.yml@7f5d24a599c03cdc59998c22578c345c518b755d

  static-analysis:
    name: PHPStan (Larastan)
    uses: SecPal/.github/.github/workflows/reusable-php-stan.yml@7f5d24a599c03cdc59998c22578c345c518b755d

  test:
    name: PEST Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !startsWith(github.head_ref, 'spike/') && !startsWith(github.ref, 'refs/heads/spike/') }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        options: >-
          --health-cmd="pg_isready -U testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext locales ripgrep
          sudo locale-gen en_US.UTF-8 de_DE.UTF-8
          sudo update-locale LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          locale -a

      - name: Install OpenTimestamps CLI
        run: |
          sudo apt-get install -y python3-pip
          pip3 install --break-system-packages opentimestamps-client
          ots --version

      - name: Create parallel test databases
        env:
          PGPASSWORD: testing
        run: |
          # Create databases for parallel test workers (base DB is testing, workers use testing_test_N)
          for i in {1..8}; do
            psql -h localhost -U testing -d testing -c "CREATE DATABASE testing_test_$i;" || true
          done

      - name: Generate KEK for testing
        run: |
          # Generate KEK file before parallel tests to prevent race conditions
          # This ensures all parallel processes use the same KEK
          mkdir -p storage/app/keys
          php -r "file_put_contents('storage/app/keys/kek.key', sodium_crypto_secretbox_keygen());"
          chmod 600 storage/app/keys/kek.key

      - name: Run parallel tests with coverage
        env:
          # Test-only APP_KEY - not used in production
          APP_KEY: base64:ZXUevbvUHFMlVnuwTiO0s7pQ1i584bpMKALKwTMNYh4=
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
          SECPAL_TEST_SCHEMA: public
          XDEBUG_MODE: coverage
        run: php artisan test --parallel --exclude-group=serial --coverage-clover coverage.xml

      - name: Run serial tests
        env:
          APP_KEY: base64:ZXUevbvUHFMlVnuwTiO0s7pQ1i584bpMKALKwTMNYh4=
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
          SECPAL_TEST_SCHEMA: public
          XDEBUG_MODE: coverage
        run: php artisan test --group=serial --coverage-clover coverage-serial.xml

      - name: Validate setup command works
        env:
          APP_KEY: base64:ZXUevbvUHFMlVnuwTiO0s7pQ1i584bpMKALKwTMNYh4=
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
          SECPAL_TEST_SCHEMA: public
        run: |
          # Verify the validate-setup command exists and runs
          # Expected to fail (no KEK/tenant keys) but command must be callable
          php artisan app:validate-setup || true
          echo "✅ app:validate-setup command is callable"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # Token is optional for public repos (tokenless uploads supported)
          # Dependabot PRs cannot access secrets, so token may be empty
          token: ${{ secrets.CODECOV_TOKEN || '' }}
          files: ./coverage.xml,./coverage-serial.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.actor) }}
        # Allow step to succeed even if upload fails for dependabot
        # This prevents blocking the PR when CODECOV_TOKEN is unavailable
        continue-on-error: ${{ contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.actor) }}
